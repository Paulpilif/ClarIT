services:
  neo4j:
    image: neo4j:latest
    container_name: clarit-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

  auth-db:
    image: postgres:16-alpine
    container_name: clarit-auth-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${AUTH_DB_NAME}
      - POSTGRES_USER=${AUTH_DB_USER}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  bdd-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clarit-bdd-api
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    depends_on:
      - neo4j

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: clarit-web
    ports:
      - "5173:80"
    volumes:
      - ${CLARIT_SHARED_DIR:-./shared}:/shared:ro
    depends_on:
      - bdd-api

volumes:
  neo4j_data:
  auth_db_data:
