version: "3.8"

services:
  neo4j:
    image: neo4j:latest
    container_name: clarit-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

  bdd-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clarit-bdd-api
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    depends_on:
      - neo4j

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: clarit-web
    ports:
      - "5173:80"
    depends_on:
      - bdd-api

volumes:
  neo4j_data:
